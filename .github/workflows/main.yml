-       # 1. Connect to Tailscale with proper flags
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          # Use your phone's Tailscale IP or MagicDNS to force immediate route propagation
          ping: "your-android-phone-tailscale-ip" 

      # 2. Force Windows Tailscale into Unattended mode & Open RDP Firewall
      - name: Configure Tailscale and RDP Firewall
        shell: powershell
        run: |
          # Ensure Tailscale runs persistently even when windows logs in/switches sessions
          tailscale up --unattended=true --accept-routes --accept-dns
          
          # Force Windows Network Profile to Private so it doesn't block RDP/ICMP over Tailscale
          Set-NetConnectionProfile -InterfaceAlias Tailscale -NetworkCategory Private
          
          # Ensure Remote Desktop is enabled and firewall rule is active
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      # 3. Prevent the workflow from instantly completing (Keep alive)
      - name: Keep Runner Alive for RDP
        shell: powershell
        run: |
          Write-Output "192.173.473.3:"
          tailscale ip -4
          # Keeps the action running for 6 hours (adjust as needed)
          Start-Sleep -Seconds 21600 
